<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" width="200" height="240">
  <defs>
    <clipPath id="square-clip">
      <rect x="9" y="8" width="82" height="82" />
    </clipPath>
    <clipPath id="pillar-clip">
      <polygon points="48,8 68,8 44,90 24,90" />
    </clipPath>
  </defs>
  
  <!-- Outer Blue Badge -->
  <rect width="100" height="120" rx="3" fill="#164194" />
  
  <!-- White Square -->
  <rect x="9" y="8" width="82" height="82" fill="#ffffff" />
  
  <!-- Inside White Square Content -->
  <g clip-path="url(#square-clip)">
    <!-- Central Blue Diagonal Pillar -->
    <polygon points="48,8 68,8 44,90 24,90" fill="#164194" />
    
    <!-- Ribbon on White (Blue) -->
    <path d="M 32,27 C 32,15 46,12 55,16 C 65,21 77,26 77,36 C 77,47 62,49 53,52 C 40,56 24,58 24,67 C 24,76 38,79 48,82 C 58,85 64,83 66,79" stroke="#164194" stroke-width="4.5" stroke-linecap="round" fill="none" />
    
    <!-- Ribbon crossing Blue Pillar (White) -->
    <g clip-path="url(#pillar-clip)">
      <path d="M 32,27 C 32,15 46,12 55,16 C 65,21 77,26 77,36 C 77,47 62,49 53,52 C 40,56 24,58 24,67 C 24,76 38,79 48,82 C 58,85 64,83 66,79" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" />
    </g>
  </g>
  
  <!-- Word FELUMA -->
  <text x="50" y="111" text-anchor="middle" fill="#ffffff" font-size="16.5" font-family="Montserrat, Arial Black, sans-serif" font-weight="900" letter-spacing="1">FELUMA</text>
</svg>